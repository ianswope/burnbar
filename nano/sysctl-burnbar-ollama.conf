# Installed as /etc/sysctl.d/90-burnbar-ollama.conf by nano/install.sh.
#
# The Jetson's GPU allocates out of the same memory the page cache fills.
# With the stock 44 MB reserve, a model load after the cache had grown failed
# in cudaMalloc (NvMapMemAllocInternalTagged error 12) every time; with 1 GiB
# kept genuinely free, three model swaps in a row loaded without dropping
# caches. Loads read a little more from disk in exchange.
vm.min_free_kbytes = 1048576
