# Installed as /etc/systemd/system/ollama.service.d/zz-burnbar.conf by nano/install.sh.
# "zz-" because drop-ins apply in name order and the last word wins: the
# box already had an override.conf setting OLLAMA_HOST and NUM_PARALLEL.
#
# Ollama moves to loopback :11435 so ollama-meter can take the public :11434.
# Every existing client keeps its URL; only the counting is new.
#
# NUM_PARALLEL=1: the stock unit asked for 5 slots × 4096 context, a 2 GiB
# KV cache that had to be one cudaMalloc on a Jetson whose unified memory
# is shared with the page cache. Loads OOMed (NvMapMemAllocInternalTagged
# error 12) until the cache was dropped. One slot cuts that allocation five
# times; a load that still fails gets its cache dropped by the plugin's
# Load button (see burnbar-local-control).
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11435"
Environment="OLLAMA_NUM_PARALLEL=1"
